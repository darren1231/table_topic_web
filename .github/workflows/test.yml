name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Report test coverage
        continue-on-error: true
        shell: bash
        run: |
          coverage_status=0
          npm run coverage 2>&1 | tee "$RUNNER_TEMP/coverage.log" || coverage_status=$?
          {
            echo '### Test coverage'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/coverage.log"
            echo '```'
            if [ "$coverage_status" -ne 0 ]; then
              echo "Coverage command exited with status $coverage_status; see the step log for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$coverage_status"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - name: Upload failed browser test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
