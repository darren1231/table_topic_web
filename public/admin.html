<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <div class="shell">
    <header class="topbar">
      <h1 data-admin-i18n="admin.title"></h1>
      <div class="top-actions">
        <select id="adminLanguage">
          <option value="zh-TW" data-admin-i18n="admin.localeZh"></option>
          <option value="en-US" data-admin-i18n="admin.localeEn"></option>
          <option value="ja-JP" data-admin-i18n="admin.localeJa"></option>
          <option value="ar" data-admin-i18n="admin.localeAr"></option>
        </select>
        <button id="adminSignIn" type="button" class="secondary" data-admin-i18n="admin.signIn"></button>
        <button id="adminSignOut" type="button" class="secondary hidden" data-admin-i18n="admin.signOut"></button>
      </div>
    </header>
    <p id="adminStatus" role="status"></p>
    <main id="adminData" class="hidden">
      <div class="api-ledger-toolbar">
        <label><span data-admin-i18n="admin.period"></span><select id="adminPeriod">
          <option value="month" data-admin-i18n="admin.month"></option>
          <option value="7" data-admin-i18n="admin.week"></option>
          <option value="30" data-admin-i18n="admin.thirtyDays"></option>
          <option value="all" data-admin-i18n="admin.allTime"></option>
        </select></label>
        <label><span data-admin-i18n="admin.purpose"></span><select id="adminKind">
          <option value="all" data-admin-i18n="admin.allKinds"></option>
          <option value="agent" data-admin-i18n="admin.agent"></option>
          <option value="analysis" data-admin-i18n="admin.analysis"></option>
          <option value="questions" data-admin-i18n="admin.questions"></option>
          <option value="polish" data-admin-i18n="admin.polish"></option>
          <option value="transcription" data-admin-i18n="admin.transcription"></option>
        </select></label>
        <label><span data-admin-i18n="admin.user"></span><select id="adminUserFilter"></select></label>
        <button id="adminRefresh" type="button" class="secondary" data-admin-i18n="admin.refresh"></button>
      </div>
      <div class="api-usage-summary">
        <article><strong id="adminCalls">0</strong><span data-admin-i18n="admin.calls"></span></article>
        <article><strong id="adminInputTokens">0</strong><span data-admin-i18n="admin.inputTokens"></span></article>
        <article><strong id="adminOutputTokens">0</strong><span data-admin-i18n="admin.outputTokens"></span></article>
        <article><strong id="adminCost">0</strong><span data-admin-i18n="admin.cost"></span></article>
        <article><strong id="adminAudioSeconds">0</strong><span data-admin-i18n="admin.audioSeconds"></span></article>
      </div>
      <h2 data-admin-i18n="admin.userTotals"></h2>
      <p class="api-ledger-note" data-admin-i18n="admin.lifetimeNote"></p>
      <div class="api-ledger-table-wrap"><table class="api-ledger-table">
        <thead><tr><th data-admin-i18n="admin.email"></th><th data-admin-i18n="admin.calls"></th><th data-admin-i18n="admin.spent"></th><th data-admin-i18n="admin.lastUsed"></th></tr></thead>
        <tbody id="adminUserRows"></tbody>
      </table></div>
      <h2 data-admin-i18n="admin.tokensTitle"></h2>
      <p class="api-ledger-note" data-admin-i18n="admin.tokenSnapshotNote"></p>
      <div class="api-ledger-table-wrap"><table class="api-ledger-table">
        <thead><tr><th data-admin-i18n="admin.email"></th><th data-admin-i18n="admin.tokenBalance"></th><th data-admin-i18n="admin.tokenStreak"></th><th data-admin-i18n="admin.lastCheckIn"></th></tr></thead>
        <tbody id="adminTokenRows"></tbody>
      </table></div>
      <h2 data-admin-i18n="admin.details"></h2>
      <div class="api-ledger-table-wrap"><table class="api-ledger-table">
        <thead><tr><th data-admin-i18n="admin.time"></th><th data-admin-i18n="admin.user"></th><th data-admin-i18n="admin.purpose"></th><th data-admin-i18n="admin.model"></th><th data-admin-i18n="admin.inputTokens"></th><th data-admin-i18n="admin.outputTokens"></th><th data-admin-i18n="admin.audioSeconds"></th><th data-admin-i18n="admin.cost"></th><th data-admin-i18n="admin.status"></th></tr></thead>
        <tbody id="adminUsageRows"></tbody>
      </table></div>
      <section id="adminFeedbackSection" aria-labelledby="adminFeedbackTitle">
        <h2 id="adminFeedbackTitle" data-admin-i18n="feedback.title"></h2>
        <div class="api-ledger-toolbar">
          <label><span data-admin-i18n="admin.status"></span><select id="adminFeedbackStatus"></select></label>
          <label><span data-admin-i18n="feedback.type"></span><select id="adminFeedbackType"></select></label>
          <label><span data-admin-i18n="adminFeedback.priority"></span><select id="adminFeedbackPriority"></select></label>
        </div>
        <div class="feedback-bulk-actions">
          <button type="button" class="secondary" id="adminFeedbackUrgent" data-admin-i18n="adminFeedback.markUrgent"></button>
          <button type="button" class="secondary" id="adminFeedbackNormal" data-admin-i18n="adminFeedback.markNormal"></button>
          <button type="button" class="secondary" id="adminFeedbackLater" data-admin-i18n="adminFeedback.markLater"></button>
          <button type="button" class="secondary" id="adminFeedbackDecline" data-admin-i18n="adminFeedback.markDeclined"></button>
          <button type="button" class="secondary" id="adminFeedbackDone" data-admin-i18n="adminFeedback.markDone"></button>
        </div>
        <p id="adminFeedbackMessage" role="status" aria-live="polite"></p>
        <div class="api-ledger-table-wrap"><table class="api-ledger-table">
          <thead><tr><th data-admin-i18n="adminFeedback.select"></th><th data-admin-i18n="adminFeedback.id"></th><th data-admin-i18n="adminFeedback.priority"></th><th data-admin-i18n="feedback.type"></th><th data-admin-i18n="adminFeedback.summary"></th><th data-admin-i18n="admin.time"></th><th data-admin-i18n="admin.email"></th><th data-admin-i18n="adminFeedback.issue"></th></tr></thead>
          <tbody id="adminFeedbackRows"></tbody>
        </table></div>
        <section id="adminFeedbackDetail" class="hidden" aria-labelledby="adminFeedbackDetailTitle">
          <h3 id="adminFeedbackDetailTitle"></h3>
          <p id="adminFeedbackDetailStatus"></p>
          <p id="adminFeedbackBody" class="feedback-full-text"></p>
          <h4 data-admin-i18n="adminFeedback.context"></h4>
          <dl id="adminFeedbackContext"></dl>
          <div class="settings-grid"><label class="full-field" for="adminFeedbackNote"><span data-admin-i18n="adminFeedback.note"></span><textarea id="adminFeedbackNote" rows="4"></textarea></label></div>
          <div class="dialog-actions"><button type="button" class="primary" id="adminFeedbackSaveNote" data-admin-i18n="adminFeedback.saveNote"></button></div>
          <button type="button" class="secondary" id="adminFeedbackIssue" disabled data-admin-i18n="adminFeedback.createIssue" aria-describedby="adminFeedbackIssueHint"></button>
          <p id="adminFeedbackIssueHint" class="field-help"></p>
        </section>
      </section>
    </main>
  </div>
  <dialog class="app-dialog" id="feedbackIssueDialog" aria-labelledby="feedbackIssueTitle">
    <form class="dialog-card" id="feedbackIssueForm" novalidate>
      <div class="dialog-head"><h2 id="feedbackIssueTitle" data-admin-i18n="adminFeedback.createIssue"></h2><button type="button" class="dialog-close" id="feedbackIssueClose" aria-label=""></button></div>
      <p class="security-note" data-admin-i18n="feedbackIssue.publicWarning"></p>
      <div class="settings-grid">
        <label class="full-field" for="feedbackIssueTitleInput"><span data-admin-i18n="feedbackIssue.titleLabel"></span><input id="feedbackIssueTitleInput" required></label>
        <label class="full-field" for="feedbackIssueBodyInput"><span data-admin-i18n="feedbackIssue.bodyLabel"></span><textarea id="feedbackIssueBodyInput" rows="14" required></textarea></label>
      </div>
      <fieldset class="feedback-issue-labels"><legend data-admin-i18n="feedbackIssue.labelsLabel"></legend><div id="feedbackIssueLabels"></div></fieldset>
      <p id="feedbackIssueMessage" role="status" aria-live="polite"></p>
      <div class="dialog-actions"><button type="submit" class="primary" id="feedbackIssueSubmit"></button></div>
    </form>
  </dialog>
  <script src="html-utils.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="usage-stats.js" defer></script>
  <script src="feedback-issue-draft.js" defer></script>
  <script src="admin-feedback.js" defer></script>
  <script src="admin.js" defer></script>
</body>
</html>
